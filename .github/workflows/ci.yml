name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]" -q

      - name: Ruff lint
        run: ruff check ai_context_generator/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format ai_context_generator/ tests/ --check

      - name: Mypy type check
        run: mypy ai_context_generator/

      - name: Bandit security scan
        run: bandit -r ai_context_generator/ -c pyproject.toml -q

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" -q

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  validate-workflows:
    name: Validate Workflows & Action YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install actionlint & pyyaml
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
          pip install pyyaml -q

      - name: Run actionlint on workflows
        run: actionlint .github/workflows/*.yml

      - name: Validate action.yml syntax
        run: python -c "import yaml; yaml.safe_load(open('action.yml'))"

  validate-examples:
    name: Validate Example Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e . -q

      - name: Validate scanner on own repo
        run: |
          python -c "
          from pathlib import Path
          from ai_context_generator.scanner import CodebaseScanner
          from ai_context_generator.analyzer import ProjectAnalyzer
          from ai_context_generator.config import load_config

          workspace = Path('.')
          cfg = load_config(workspace)
          scanner = CodebaseScanner(workspace, cfg.scan.exclude_dirs, cfg.scan.max_file_size_kb, cfg.scan.max_files)
          scan = scanner.scan()
          analyzer = ProjectAnalyzer()
          profile = analyzer.analyze(scan)
          assert profile.primary_language == 'Python', profile.primary_language
          assert profile.domain, 'Domain not detected'
          assert profile.has_tests, 'tests/ directory not detected'
          assert 'ai_context_generator' in profile.directory_tree, profile.directory_tree
          assert 'GitHub Actions' in profile.cicd_platforms, profile.cicd_platforms
          assert 'openai' in profile.key_dependencies, profile.key_dependencies
          print(f'OK — {profile.primary_language} / {profile.domain} / {profile.frameworks}')
          "

      - name: Verify the CLI runs end-to-end (dry run)
        run: ai-context-generator generate --dry-run --json

      - name: Verify the packaged wheel contains the prompt template
        run: |
          pip install build -q
          python -m build --wheel -o dist/
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert 'ai_context_generator/prompts/generate_agents.md' in names, names
          print('OK — prompt template is packaged')
          EOF

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test, validate-workflows, validate-examples]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      released: ${{ steps.tag_check.outputs.exists == 'false' }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          # Floating major tag: 2.0.0 -> v2. Hardcoding v1 here used to point the
          # v1 tag at a v2 release the moment the major version was bumped.
          echo "major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Update floating major tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.version.outputs.major }}" \
            -m "Update ${{ steps.version.outputs.major }} floating tag to ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.major }}" --force

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    # Tags pushed with the default GITHUB_TOKEN do NOT trigger other workflows,
    # so the `on: push: tags:` trigger in publish-pypi.yml never fired for a
    # release cut by the job above. Calling the workflow directly is what makes
    # a release actually reach PyPI.
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
