name: Publish to PyPI

on:
  # In practice this rarely fires: tags pushed by CI use the default
  # GITHUB_TOKEN, and GitHub does not let such a push trigger other workflows.
  # Kept for the case where a maintainer pushes a `v*.*.*` tag by hand.
  push:
    tags:
      - 'v*.*.*'
  # Also allow publishing from a manually published GitHub Release.
  release:
    types: [published]
  # Manual trigger for one-off / recovery publishes.
  workflow_dispatch:
  # The path actually used by the CI release job in ci.yml, which calls this
  # workflow directly right after cutting a new tag (see the `publish` job
  # there) since the `push: tags:` trigger above cannot fire for it. The caller
  # passes PYPI_API_TOKEN explicitly rather than `secrets: inherit`.
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: false

# Serialize publishes rather than letting two triggers (e.g. a manual dispatch
# racing the CI-triggered call) build and upload concurrently. Never cancel an
# in-flight publish — a half-finished upload is worse than a queued one.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Build and publish package to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: pip install build -q

      - name: Build source distribution and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
