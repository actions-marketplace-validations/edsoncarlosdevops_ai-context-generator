name: Publish to PyPI

on:
  # Triggered automatically when the CI release job creates the version tag
  # (e.g. v1.2.0). Requires a trusted publisher configured on PyPI for this
  # repository (see README / https://pypi.org/manage/account/publishing/).
  push:
    tags:
      - 'v*.*.*'
  # Also allow publishing from a manually published GitHub Release.
  release:
    types: [published]
  # Manual trigger, and the path used by the CI release job (tag pushes made
  # with GITHUB_TOKEN cannot trigger this workflow on their own).
  workflow_dispatch:
  workflow_call:

jobs:
  pypi-publish:
    name: Build and publish package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: pip install build -q

      - name: Build source distribution and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
