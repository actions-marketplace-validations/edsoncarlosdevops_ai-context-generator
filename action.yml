name: 'AI Context Generator'
description: >
  Scan any repository and auto-generate AGENTS.md, .cursorrules, CLAUDE.md,
  .windsurfrules and more — the universal AI context layer for every AI coding tool.
author: 'edsoncarlosdevops'

branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  ai_api_key:
    description: 'LLM API Key (DeepSeek, OpenAI, Anthropic-compatible, Ollama, etc.)'
    required: true
  model:
    description: 'LLM model name (e.g. deepseek-chat, gpt-4o, claude-3-5-sonnet-20241022, llama3)'
    required: false
    default: 'deepseek-chat'
  base_url:
    description: 'Custom LLM base URL. Default: DeepSeek endpoint. Use http://localhost:11434/v1 for Ollama.'
    required: false
    default: 'https://api.deepseek.com'
  language:
    description: 'Output language for AGENTS.md (english, portuguese, spanish, french, german)'
    required: false
    default: 'english'
  create_pr:
    description: 'Open a PR automatically with the generated files (true/false)'
    required: false
    default: 'true'
  replace:
    description: 'Replace existing AGENTS.md entirely instead of enriching it (true/false)'
    required: false
    default: 'false'
  no_bridge:
    description: 'Skip generating bridge files (.cursorrules, CLAUDE.md, etc.) — only write AGENTS.md'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in seconds for each LLM API call'
    required: false
    default: '120'
  max_files:
    description: 'Hard cap on the number of files scanned'
    required: false
    default: '100000'
  config:
    description: 'Path to a .ai_context.toml config file (defaults to the workspace root)'
    required: false
  github_token:
    description: 'GitHub token for opening PRs. Defaults to the built-in GITHUB_TOKEN.'
    required: false

outputs:
  agents_md_written:
    description: 'true if any AI context file changed on disk, false if everything was already up-to-date'
    value: ${{ steps.generate.outputs.agents_md_written }}
  agents_md_updated:
    description: 'true if AGENTS.md itself was rewritten by the LLM this run'
    value: ${{ steps.generate.outputs.agents_md_updated }}

runs:
  using: "composite"
  steps:
    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ai-context-generator
      run: pip install "${{ github.action_path }}" -q
      shell: bash

    - name: Generate AI context files
      id: generate
      shell: bash
      env:
        # Passed via env so the secret never appears on the command line or in logs.
        AI_API_KEY: ${{ inputs.ai_api_key }}
      run: |
        CMD=(ai-context-generator generate
          --workspace "${{ github.workspace }}"
          --model "${{ inputs.model }}"
          --base-url "${{ inputs.base_url }}"
          --language "${{ inputs.language }}"
          --timeout "${{ inputs.timeout }}"
          --max-files "${{ inputs.max_files }}")
        if [ -n "${{ inputs.config }}" ]; then
          CMD+=(--config "${{ inputs.config }}")
        fi
        if [ "${{ inputs.replace }}" = "true" ]; then
          CMD+=(--replace)
        fi
        if [ "${{ inputs.no_bridge }}" = "true" ]; then
          CMD+=(--no-bridge)
        fi

        # `shell: bash` runs with `set -e`, so a non-zero exit aborts the step
        # here and the failure is annotated by the CLI itself.
        echo "::group::ai-context-generator output"
        "${CMD[@]}"
        echo "::endgroup::"

        # The CLI reports whether AGENTS.md itself was rewritten. Renamed so it
        # cannot collide with the change-detection output computed below.
        if [ -f "$GITHUB_OUTPUT" ] && grep -q "^agents_md_written=" "$GITHUB_OUTPUT"; then
          UPDATED="$(grep "^agents_md_written=" "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)"
        else
          UPDATED="false"
        fi
        echo "agents_md_updated=$UPDATED" >> "$GITHUB_OUTPUT"

        # Detect whether any context file changed. `git status --porcelain` also
        # catches brand-new (untracked) files, which `git diff` silently ignores.
        CHANGED="$(git -C "${{ github.workspace }}" status --porcelain -- \
          AGENTS.md .ai-context.sig .gitattributes .cursorrules .windsurfrules \
          .clinerules .rules CONVENTIONS.md CLAUDE.md .github/copilot-instructions.md \
          .amazonq/rules/project-rules.md .continue/rules.md 2>/dev/null)"
        if [ -z "$CHANGED" ]; then
          echo "agents_md_written=false" >> "$GITHUB_OUTPUT"
          echo "::notice::AI context files are already up-to-date. No PR will be created."
        else
          echo "agents_md_written=true" >> "$GITHUB_OUTPUT"
          echo "::notice::AI context files were updated successfully."
        fi

    - name: Create Pull Request
      if: ${{ inputs.create_pr == 'true' && steps.generate.outputs.agents_md_written == 'true' }}
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github_token || github.token }}
        commit-message: "docs(ai-context): update AI context files"
        title: "docs(ai-context): update AGENTS.md and AI tool context files"
        branch: "auto/update-ai-context"
        delete-branch: true
        body: |
          ## AI Context Generator — Automated Update

          This PR was created automatically by [ai-context-generator](https://github.com/edsoncarlosdevops/ai-context-generator).

          ### What changed

          The tool scanned this repository and updated the AI context governance files to reflect the current codebase.

          ### Files updated

          | File | Purpose |
          |------|---------|
          | `AGENTS.md` | Master governance file for all AI coding assistants |
          | `.cursorrules` | Cursor IDE context |
          | `.windsurfrules` | Windsurf (Codeium) context |
          | `CLAUDE.md` | Claude Code context |
          | `.github/copilot-instructions.md` | GitHub Copilot context |

          ### Review checklist

          - [ ] The generated rules accurately reflect the current architecture
          - [ ] No sensitive information is included in AGENTS.md
          - [ ] The technology stack detection looks correct

          ---

          > To customise generation, add `.ai_context.toml` to your repository root.
          > See [documentation](https://github.com/edsoncarlosdevops/ai-context-generator#configuration) for all options.
