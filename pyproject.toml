[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-context-generator"
version = "2.0.0"
description = "Scan any repository and auto-generate AGENTS.md, .cursorrules, CLAUDE.md for every AI coding tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "edsoncarlosdevops", email = "edsoncarlosdevops@gmail.com" }]
keywords = [
  "AGENTS.md", "cursorrules", "CLAUDE.md", "ai context", "llm context",
  "cursor", "windsurf", "copilot", "cline", "amazon-q", "code-governance",
  "devtools", "ai-assistant", "deepseek", "openai", "github-actions"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Environment :: Console",
]
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "bandit>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/edsoncarlosdevops/ai-context-generator"
Repository = "https://github.com/edsoncarlosdevops/ai-context-generator"
Issues = "https://github.com/edsoncarlosdevops/ai-context-generator/issues"
Changelog = "https://github.com/edsoncarlosdevops/ai-context-generator/releases"

[project.scripts]
ai-context-generator = "ai_context_generator.cli:main"

[tool.setuptools.packages.find]
include = ["ai_context_generator*"]

[tool.setuptools.package-data]
ai_context_generator = ["py.typed", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.bandit]
targets = ["ai_context_generator"]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B110"]

[tool.coverage.run]
source = ["ai_context_generator"]
omit = ["ai_context_generator/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=ai_context_generator --cov-report=term-missing:skip-covered --cov-report=xml"
