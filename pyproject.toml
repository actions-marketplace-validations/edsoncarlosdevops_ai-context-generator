[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-context-generator"
version = "1.0.0"
description = "Scan any repository and auto-generate AGENTS.md, .cursorrules, CLAUDE.md for every AI coding tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "edsoncarlosdevops", email = "edsoncarlosdevops@gmail.com" }]
keywords = [
  "AGENTS.md", "cursorrules", "CLAUDE.md", "ai context", "llm context",
  "cursor", "windsurf", "copilot", "cline", "amazon-q", "code-governance",
  "devtools", "ai-assistant", "deepseek", "openai", "github-actions"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
  "Environment :: Console",
]
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/edsoncarlosdevops/ai-context-generator"
Repository = "https://github.com/edsoncarlosdevops/ai-context-generator"
Issues = "https://github.com/edsoncarlosdevops/ai-context-generator/issues"
Changelog = "https://github.com/edsoncarlosdevops/ai-context-generator/releases"

[project.scripts]
ai-context-generator = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "prompts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
