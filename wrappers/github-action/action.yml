name: 'AI Context Generator'
description: 'Scan any repository and auto-generate AGENTS.md, .cursorrules, CLAUDE.md for any AI coding tool.'
author: 'edsoncarlosdevops'
branding:
  icon: 'cpu'
  color: 'purple'
inputs:
  ai_api_key:
    description: 'LLM API Key (DeepSeek, OpenAI, Anthropic, etc.)'
    required: true
  model:
    description: 'LLM model'
    required: false
    default: 'deepseek-chat'
  language:
    description: 'Output language for AGENTS.md'
    required: false
    default: 'english'
  create_pr:
    description: 'Open a PR automatically with the generated files'
    required: false
    default: 'true'
  replace:
    description: 'Replace existing AGENTS.md instead of enriching'
    required: false
    default: 'false'
  github_token:
    description: 'GitHub token for opening PRs (uses GITHUB_TOKEN if not set)'
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash
      
    - name: Generate AI Context
      run: |
        CMD="python ${{ github.action_path }}/core/cli.py generate --workspace ${{ github.workspace }} --api-key ${{ inputs.ai_api_key }} --model ${{ inputs.model }} --language ${{ inputs.language }}"
        if [ "${{ inputs.replace }}" == "true" ]; then
          CMD="$CMD --replace"
        fi
        eval $CMD
      shell: bash
      
    - name: Create Pull Request
      if: ${{ inputs.create_pr == 'true' }}
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github_token || github.token }}
        commit-message: "docs: update AI context files (AGENTS.md)"
        title: "docs: update AI context files (AGENTS.md)"
        branch: "auto/update-ai-context"
