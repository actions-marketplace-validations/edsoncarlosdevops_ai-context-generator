generator:ai-context:
  stage: docs
  image: python:3.12-slim
  variables:
    # Set as a masked CI/CD variable in GitLab.
    AI_API_KEY: $AI_API_KEY
  rules:
    - when: manual
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pip install ai-context-generator
    - ai-context-generator generate --workspace $CI_PROJECT_DIR --model ${MODEL:-deepseek-chat}
  artifacts:
    paths: [AGENTS.md, .cursorrules, CLAUDE.md]
    expire_in: 7 days
